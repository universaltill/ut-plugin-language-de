name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, independent of any push to THIS repo: catches drift introduced by
  # a CORE change (new base-locale keys landing in universal-till) that this
  # pack never gets updated for -- the exact failure mode behind ut-docs#292,
  # where core shipped 6 new pfand.* keys, nobody touched this repo, and a
  # German till silently rendered English with no signal anywhere. A push
  # trigger alone can never catch that class of drift because nothing here
  # ever changes when the gap opens.
  #
  # HONEST LIMITATION: GitHub disables scheduled workflows in PUBLIC repos
  # after 60 days with no repository activity (this repo is public) -- and
  # "this repo has gone quiet" is exactly the condition the cron exists to
  # cover, so its coverage silently reaches zero precisely when it's needed
  # most. This is NOT a durable guarantee. workflow_dispatch below is the
  # manual/pipeline-triggered fallback while that's true; moving this check
  # into core's own CI (so it runs on core's activity, not this repo's) is
  # tracked separately and is the real fix.
  schedule:
    - cron: "17 3 * * 1" # Monday 03:17 UTC -- quiet, low-traffic slot
  workflow_dispatch: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest + plugin manifest
        run: scripts/validate.sh
      - name: Package (dry run)
        run: scripts/package.sh

  key-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Self-tests run first (and even if a later step would fail) so a red
      # drift run always comes with an answer to "is the guard itself
      # sound?" -- a network failure or core-originated drift in the next
      # step must never mask whether the checker that produced it is broken.
      - name: Key-drift guard self-tests
        if: always()
        run: scripts/check-key-drift.test.sh
      - name: Key-drift guard against core base locale (ut-docs#292)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-key-drift.sh
